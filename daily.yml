name: TOP BMV Diario 8:35 AM

on:
  schedule:
    # 8:35 AM Ciudad de México = 14:35 UTC (México no tiene horario de verano)
    # Lunes a Viernes
    - cron: '35 14 * * 1-5'
  workflow_dispatch: # para probarlo manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar bot BMV
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py